<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>통역 자막</title>
  <meta name="description" content="두 언어 대화를 실시간으로 받아 적고 AI로 통역해 화면에 보여 주는 웹앱">
  <meta name="theme-color" content="#16243a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <button id="sitBtn" class="chip"></button>
    <span id="viewerBadge" class="badge" data-i18n="viewerBadge" hidden></span>
    <span class="grow"></span>
    <span id="usage" class="usage"></span>
    <button id="shareBtn" class="icon-btn" data-i18n-title="shareTitle">📡</button>
    <button id="fontDown" class="icon-btn viewer-only" aria-label="A-" hidden>A−</button>
    <button id="fontUp" class="icon-btn viewer-only" aria-label="A+" hidden>A+</button>
    <button id="settingsBtn" class="icon-btn" data-i18n-title="settings">⚙</button>
  </header>

  <div id="warn" class="banner warn" hidden></div>
  <div id="notice" class="banner notice" hidden></div>
  <div id="shareBar" class="banner share" hidden></div>

  <div class="speaking" id="speakingBar" role="radiogroup">
    <span class="lbl" data-i18n="speaking"></span>
    <button data-v="auto" data-i18n="auto"></button>
    <button data-v="left"></button>
    <button data-v="right"></button>
    <span class="grow"></span>
    <button id="swapBtn" class="swap" data-i18n-title="swap">⇅</button>
  </div>

  <main id="panes" class="panes">
    <section class="pane" data-side="left" id="paneLeft">
      <div class="pane-head">
        <button class="pname" data-side="left"></button>
        <span class="grow"></span>
        <button class="read" data-side="left" aria-pressed="false" data-i18n-title="readBtn">🔈</button>
        <button class="expand" data-side="left" data-i18n-title="expand">⤢</button>
      </div>
      <div class="pane-body" data-side="left"></div>
    </section>
    <section class="pane" data-side="right" id="paneRight">
      <div class="pane-head">
        <button class="pname" data-side="right"></button>
        <span class="grow"></span>
        <button class="read" data-side="right" aria-pressed="false" data-i18n-title="readBtn">🔈</button>
        <button class="expand" data-side="right" data-i18n-title="expand">⤢</button>
      </div>
      <div class="pane-body" data-side="right"></div>
    </section>
    <button id="bothBtn" class="both-btn" data-i18n="showBoth" hidden></button>
  </main>

  <footer class="bottom" id="bottomBar">
    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText"></span>
      <canvas id="meter" width="90" height="8" aria-hidden="true"></canvas>
    </div>
    <button id="startBtn" class="start"></button>
  </footer>

  <!-- 언어 고르기 -->
  <dialog id="langDlg" class="sheet">
    <h2 id="langDlgTitle"></h2>
    <div id="langList" class="list"></div>
    <form method="dialog"><button class="ghost wide" data-i18n="close"></button></form>
  </dialog>

  <!-- 상황 고르기 -->
  <dialog id="sitDlg" class="sheet">
    <h2 data-i18n="sitTitle"></h2>
    <p class="hint" data-i18n="sitHint"></p>
    <div id="sitList" class="grid"></div>
    <label class="field"><span data-i18n="noteLabel"></span>
      <input id="noteInput" type="text" maxlength="200" data-i18n-ph="notePh">
    </label>
    <form method="dialog" class="row-end"><button class="primary" id="sitDone" data-i18n="ok"></button></form>
  </dialog>

  <!-- 공유 -->
  <dialog id="shareDlg" class="sheet">
    <h2 data-i18n="shareTitle"></h2>
    <p class="hint" data-i18n-html="shareDesc"></p>
    <p id="shareMode" class="hint"></p>
    <div id="shareLinkBox" hidden>
      <div class="seg-wrap"><span class="hint" data-i18n="shareFor"></span><div id="shareFor" class="seg"></div></div>
      <div id="qr" class="qr"></div>
      <input id="shareLink" type="text" readonly class="link">
      <div class="row">
        <button id="shareCopy" class="ghost" type="button" data-i18n="shareCopy"></button>
        <a id="shareOpen" class="ghost" target="_blank" rel="noopener">↗</a>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="shareToggle" class="primary" type="button"></button>
      <form method="dialog"><button class="ghost" data-i18n="close"></button></form>
    </div>
  </dialog>

  <!-- 설정 -->
  <dialog id="settingsDlg" class="page">
    <div class="page-head">
      <h2 data-i18n="settings"></h2>
      <form method="dialog"><button class="icon-btn" aria-label="✕">✕</button></form>
    </div>

    <section class="card host-only">
      <h3 data-i18n="secMode"></h3>
      <label class="opt"><input type="radio" name="mode" value="free"> <span><b data-i18n="modeFree"></b><br><small data-i18n="modeFreeDesc"></small></span></label>
      <label class="opt"><input type="radio" name="mode" value="openai"> <span><b data-i18n="modeOpenai"></b><br><small data-i18n="modeOpenaiDesc"></small></span></label>
      <label class="opt disabled"><input type="radio" name="mode" value="member" disabled> <span><b data-i18n="modeMember"></b> <em class="tag" data-i18n="soon"></em><br><small data-i18n="modeMemberDesc"></small></span></label>

      <div id="keyBox" class="keybox">
        <label class="field"><span data-i18n="keyLabel"></span>
          <span class="keyrow">
            <input id="keyInput" class="masked" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-ph="keyPh">
            <button id="keyShow" class="ghost" type="button" data-i18n="show"></button>
          </span>
        </label>
        <div class="row">
          <button id="keyPaste" class="ghost" type="button" data-i18n="paste"></button>
          <button id="keyTest" class="ghost" type="button" data-i18n="keyTest"></button>
          <button id="keySave" class="primary" type="button" data-i18n="save"></button>
          <button id="keyDel" class="ghost danger" type="button" data-i18n="del"></button>
        </div>
        <p id="keyMsg" class="hint"></p>
        <p class="hint" data-i18n="pasteHint"></p>
        <details class="guide">
          <summary data-i18n="guideTitle"></summary>
          <ol>
            <li data-i18n-html="guide1"></li>
            <li data-i18n-html="guide2"></li>
            <li data-i18n-html="guide3"></li>
            <li data-i18n-html="guide4"></li>
          </ol>
          <p class="hint" data-i18n="guideCost"></p>
          <p class="hint" data-i18n="guideWarn"></p>
        </details>
      </div>
    </section>

    <section class="card">
      <h3 data-i18n="secScreen"></h3>
      <label class="field"><span data-i18n="uiLang"></span>
        <select id="uiLangSel"></select>
      </label>
      <label class="field"><span data-i18n="fontSize"></span> <output id="fontOut"></output>
        <input id="fontRange" type="range" min="14" max="48" step="2">
      </label>
      <label class="field"><span data-i18n="layout"></span>
        <select id="layoutSel">
          <option value="auto" data-i18n="layoutAuto"></option>
          <option value="stack" data-i18n="layoutStack"></option>
          <option value="side" data-i18n="layoutSide"></option>
        </select>
      </label>
      <label class="switch"><input id="flipChk" type="checkbox"> <span data-i18n="flipTop"></span></label>
    </section>

    <section class="card host-only">
      <h3 data-i18n="secTerms"></h3>
      <p class="hint" data-i18n="termsHint"></p>
      <textarea id="termsInput" rows="4" data-i18n-ph="termsPh"></textarea>
    </section>

    <section class="card host-only">
      <h3 data-i18n="secRead"></h3>
      <label class="field"><span data-i18n="voice"></span>
        <select id="voiceSel"></select>
      </label>
      <label class="switch"><input id="muteChk" type="checkbox"> <span><span data-i18n="muteMic"></span> <small data-i18n="muteMicHint"></small></span></label>
    </section>

    <section class="card host-only">
      <h3 data-i18n="secMic"></h3>
      <label class="field"><span data-i18n="sens"></span> <output id="sensOut"></output>
        <input id="sensRange" type="range" min="1" max="10" step="1">
        <small class="hint" data-i18n="sensHint"></small>
      </label>
      <label class="field"><span data-i18n="silence"></span> <output id="silOut"></output>
        <input id="silRange" type="range" min="0.4" max="2" step="0.1">
        <small class="hint" data-i18n="silenceHint"></small>
      </label>
    </section>

    <section class="card host-only">
      <h3 data-i18n="secHistory"></h3>
      <p class="hint" id="histInfo"></p>
      <div class="row">
        <button id="histDown" class="ghost" type="button" data-i18n="histDown"></button>
        <button id="histClear" class="ghost danger" type="button" data-i18n="histClear"></button>
      </div>
    </section>

    <section class="card about">
      <p><span data-i18n="title"></span> · <span id="ver"></span> · <a href="privacy.html" target="_blank" data-i18n="privacy"></a></p>
      <p class="hint" data-i18n="aboutHint"></p>
    </section>
  </dialog>

  <script src="js/vendor/qrcode-1.4.4.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
